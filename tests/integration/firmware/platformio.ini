[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board     = esp32-s3-devkitm-1
framework = arduino
build_flags =
    -std=gnu++23
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDOCTEST_CONFIG_SUPER_FAST_ASSERTS
    -DDOCTEST_CONFIG_NO_POSIX_SIGNALS
    -DDOCTEST_THREAD_LOCAL=
    -DNOTE_PRINTABLE=0
    -I${PROJECT_DIR}/../..
lib_deps =
    doctest/doctest@^2.4.11
    ; pio-test-runner — pinned to a tagged release so GitHub Actions
    ; can resolve it without a local checkout. Local dev can override
    ; with PIO_LIB_OVERRIDE or by editing this line back to a
    ; symlink://${sysenv.HOME}/e/pio-test-runner while iterating.
    https://github.com/m-mcgowan/embedded-test-runner.git#v0.3.1
    ; nlohmann-json is a heavy dep for embedded, but the backend-parity
    ; tests exercise it on device as a stress check (paired with the
    ; cjson backend which is the realistic embedded choice).
    johboh/nlohmann-json@^3.12.0
    # the note-cpp library
    symlink://../../..
monitor_speed = 115200
board_build.partitions = partitions.csv
board_upload.after_reset = watchdog-reset
test_framework = custom
test_build_src = no
extra_scripts = pre:set_pins.py

; --- Pin definitions (edit for your board) ---
; env.sh / boards.sh environment variables override these at build time.

[pins:serial]
build_flags =
    -DRX1=38
    -DTX1=39

[pins:i2c]
build_flags =
    -DNOTECARD_I2C_SDA=14
    -DNOTECARD_I2C_SCL=21

; --- Test environments ---
; Select which interface(s) to test:
;   pio test -e serial    Serial only
;   pio test -e i2c       I2C only
;   pio test -e both      Both interfaces

[env:serial]
; ARDUINO_LOOP_STACK_SIZE bumped from 8 KB default — codegen-emitted
; resource-group tests (test_api_context.cpp) pin ~150 B of stack per
; distinct request type, and integration fixtures (test_jsonb_i2c.cpp,
; backend parity suites) build large enough frames that the loop task's
; default 8 KB stack overflows and corrupts doctest's cross-SUBCASE state.
build_flags =
    ${env.build_flags}
    ${pins:serial.build_flags}
    -DARDUINO_LOOP_STACK_SIZE=32768

; Same as serial but with JSONB as the wire format. Exercises the
; JSON-vs-JSONB orthogonal axis end-to-end on real hardware.
[env:serial-jsonb]
extends = env:serial
build_flags =
    ${env:serial.build_flags}
    -DNOTE_JSONB=1

; Coverage build — instruments note-cpp headers + tests, dumps .gcda over USB-CDC.
; ARDUINO_LOOP_STACK_SIZE bumped from 8 KB default. The trace-pc env needs
; 24 KB because codegen-emitted resource-group tests (test_api_context.cpp)
; pin ~150 B of stack per distinct request type, and "Api::card resource
; group"'s 130 sequential h.api.execute(...) calls push the live frame to
; ~19.5 KB at any optimisation level (sequential temporaries of distinct
; types don't get slot-merged by GCC). The gcov env only runs test_fixtures
; so 16 KB is enough there. See
; pio-cov/docs/issues/2026-05-01-tracepc-dump-crash-esp32s3.md.
[env:serial-coverage]
extends = env:serial
build_flags =
    ${env:serial.build_flags}
    -DCOV_ENABLED=1
    -DARDUINO_LOOP_STACK_SIZE=32768
lib_deps =
    ${env.lib_deps}
    https://github.com/m-mcgowan/pio-cov.git#v0.1.0
extra_scripts =
    ${env.extra_scripts}
    pre:${PROJECT_LIBDEPS_DIR}/${PIOENV}/pio-cov/pio_cov.py
; Instrument note-cpp headers (anywhere under a 'note/' directory) and test sources.
custom_cov_filter = .*/(note|test)/.*

; trace-pc coverage — lightweight line coverage via -fsanitize-coverage=trace-pc.
; Use when the default gcov backend hits OOM on gcda dumps (a 65 KB malloc
; per source file is required, and the integration firmware has too much
; heap pressure to satisfy it). trace-pc uses a fixed bitmap set at boot,
; so no per-file allocation at dump time.
; Decode with:
;   python3 -m pio_cov.trace_pc --elf .pio/build/serial-coverage-tracepc/firmware.elf \
;       --log <log> --output /tmp/device.info
[env:serial-coverage-tracepc]
extends = env:serial
build_flags =
    ${env:serial.build_flags}
    -DCOV_ENABLED=1
    -DARDUINO_LOOP_STACK_SIZE=32768
build_src_flags =
    -Og
    -g3
lib_deps =
    ${env.lib_deps}
    https://github.com/m-mcgowan/pio-cov.git#v0.1.0
extra_scripts =
    ${env.extra_scripts}
    pre:${PROJECT_LIBDEPS_DIR}/${PIOENV}/pio-cov/pio_cov.py
    post:${PROJECT_LIBDEPS_DIR}/${PIOENV}/pio-cov/pio_cov_snapshot_elf.py
custom_cov_backend = trace-pc
custom_cov_trace_pc_bitmap_bytes = 32768
custom_cov_filter = .*/(note|test)/.*

[env:i2c]
; ARDUINO_LOOP_STACK_SIZE bumped from 8 KB default — see env:serial.
build_flags =
    ${env.build_flags}
    ${pins:i2c.build_flags}
    -DARDUINO_LOOP_STACK_SIZE=32768

; Same as i2c but with JSONB as the wire format. See env:serial-jsonb.
[env:i2c-jsonb]
extends = env:i2c
build_flags =
    ${env:i2c.build_flags}
    -DNOTE_JSONB=1

[env:both]
build_flags = ${env.build_flags} ${pins:serial.build_flags} ${pins:i2c.build_flags}

; Intentionally has no pin definitions — verifies the #error guard fires.
[env:nointerface]
build_flags = ${env.build_flags}
