[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board     = esp32-s3-devkitm-1
framework = arduino
build_flags =
    -std=gnu++23
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDOCTEST_CONFIG_SUPER_FAST_ASSERTS
    -DDOCTEST_CONFIG_NO_POSIX_SIGNALS
    -DDOCTEST_THREAD_LOCAL=
lib_deps =
    doctest/doctest@^2.4.11
    https://github.com/m-mcgowan/pio-test-runner.git
    # the note-cpp library
    symlink://../../..
monitor_speed = 115200
board_upload.after_reset = watchdog-reset
test_framework = custom
test_build_src = no
extra_scripts = pre:set_pins.py

; --- Pin definitions (edit for your board) ---
; env.sh / boards.sh environment variables override these at build time.

[pins:serial]
build_flags =
    -DRX1=38
    -DTX1=39

[pins:i2c]
build_flags =
    -DNOTECARD_I2C_SDA=14
    -DNOTECARD_I2C_SCL=21

; --- Test environments ---
; Select which interface(s) to test:
;   pio test -e serial    Serial only
;   pio test -e i2c       I2C only
;   pio test -e both      Both interfaces

[env:serial]
build_flags = ${env.build_flags} ${pins:serial.build_flags}

[env:i2c]
build_flags = ${env.build_flags} ${pins:i2c.build_flags}

[env:both]
build_flags = ${env.build_flags} ${pins:serial.build_flags} ${pins:i2c.build_flags}

; Intentionally has no pin definitions — verifies the #error guard fires.
[env:nointerface]
build_flags = ${env.build_flags}
