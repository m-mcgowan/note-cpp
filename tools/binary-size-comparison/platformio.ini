; Binary size comparison: note-c vs note-cpp on the same platform.
;
; Build all:    pio run
; Compare:      pio run -t size

[platformio]
src_dir = src

; ═══════════════════════════════════════════════════════════════════════════
; Common settings
; ═══════════════════════════════════════════════════════════════════════════

[notec_common]
lib_deps = blues/Blues Wireless Notecard
build_flags = -DUSE_NOTEC
build_src_filter = +<main_notec.cpp>

[notecpp_common]
; note-cpp only — cJSON (when used) comes from ESP-IDF (already available on ESP32)
lib_deps = symlink://../..
build_src_filter = +<main_notecpp.cpp>

[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = esp32-s3-devkitm-1
framework = arduino
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32s3-notec]
extends = esp32_common, notec_common

[env:esp32s3-notecpp]
extends = esp32_common, notecpp_common
build_flags =
    ${esp32_common.build_flags}
    -DUSE_NOTECPP
    -std=gnu++23

; ═══════════════════════════════════════════════════════════════════════════
; ESP8266 — constrained platform (double == float, triggers NOTE_C_LOW_MEM)
; note-cpp does not compile (tl::expected incompatible with GCC 10.3)
; ═══════════════════════════════════════════════════════════════════════════

; [env:esp8266-notec]
; platform = espressif8266
; board = nodemcuv2
; framework = arduino
; build_flags = ${notec_common.build_flags}
; lib_deps = ${notec_common.lib_deps}
; build_src_filter = ${notec_common.src_filter}

; ═══════════════════════════════════════════════════════════════════════════
; AVR (Arduino Uno) — 32 KB flash, 2 KB RAM, double == float
; ═══════════════════════════════════════════════════════════════════════════

[env:avr-notec]
platform = atmelavr
board = uno
framework = arduino
build_flags =
    ${notec_common.build_flags}
    -DSERIAL_TX_BUFFER_SIZE=16
    -DSERIAL_RX_BUFFER_SIZE=32
lib_deps = ${notec_common.lib_deps}
build_src_filter = ${notec_common.build_src_filter}

[avr_notecpp_common]
; Shared config for note-cpp AVR builds (all API styles).
platform = atmelavr
board = uno
framework = arduino
; USE_NOTECPP_AVR is a test-app flag (not part of the note-cpp library).
; It gates AVR-specific code in main_avr_notecpp.cpp: StaticNotecard,
; MonotonicArena, and the API_STYLE comparison for binary size measurement.
build_flags =
    -DUSE_NOTECPP_AVR
    -DNOTE_MINIMAL
    -fno-threadsafe-statics
    -DSERIAL_TX_BUFFER_SIZE=16
    -DSERIAL_RX_BUFFER_SIZE=32
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17
lib_deps =
    ${notecpp_common.lib_deps}
    https://github.com/modm-io/avr-libstdcpp.git
src_filter = +<main_avr_notecpp.cpp>
lib_ldf_mode = chain+
extra_scripts = pre:exclude_avr_libstdcpp_src.py

[env:avr-notecpp]
; API_STYLE=1: Api groups — api.hub.set().product(...).execute()
; Uses slightly more flash for the group instances.
extends = avr_notecpp_common
build_flags =
    ${avr_notecpp_common.build_flags}
    -DAPI_STYLE=1

[env:avr-notecpp-direct]
; API_STYLE=2: Direct assignment and execute — nc.execute(req)
extends = avr_notecpp_common
build_flags =
    ${avr_notecpp_common.build_flags}
    -DAPI_STYLE=2

[env:avr-notecpp-raw]
; API_STYLE=3: Raw JSON + custom JsonSink via transact_dispatch (SAX parser).
; Lowest response-RAM footprint, full SAX machinery in flash.
extends = avr_notecpp_common
build_flags =
    ${avr_notecpp_common.build_flags}
    -DAPI_STYLE=3

[env:avr-notecpp-scan]
; API_STYLE=4: Raw JSON + JsonView via transact_raw (no SAX parser).
; Lowest flash footprint — field extraction via note::scan / JsonView
; against a buffered response. Scan keys are RAM-resident literals.
extends = avr_notecpp_common
build_flags =
    ${avr_notecpp_common.build_flags}
    -DAPI_STYLE=4

[env:avr-notecpp-scan-flash]
; API_STYLE=4 with flash-resident scan keys (USE_FLASH_KEYS=1).
; Scan keys are wrapped via K(s) = note::flash(F(s)) so they live in
; PROGMEM instead of RAM. Measures the realistic RAM win on AVR.
extends = avr_notecpp_common
build_flags =
    ${avr_notecpp_common.build_flags}
    -DAPI_STYLE=4
    -DUSE_FLASH_KEYS=1

[env:wokwi-notecpp]
; Wokwi integration testing on Arduino Uno (ATmega328P, 2KB RAM).
; STYLE=4 fits comfortably after the ErrorMessage + PROGMEM work
; dropped the flash + RAM footprint; STYLE=1/2/3 may still stack-
; overflow on Uno — use the Mega override below for those.
; Select the API style with the API_STYLE env var (1/2/3/4). If unset,
; the in-source default (STYLE=1 — api groups) applies. Example:
;   API_STYLE=4 pio run -e wokwi-notecpp
extends = avr_notecpp_common
extra_scripts =
    ${avr_notecpp_common.extra_scripts}
    pre:apply_api_style.py

[env:wokwi-notecpp-mega]
; Same sketch on Mega 2560 (8KB RAM) for styles 1/2/3 that don't fit
; on Uno's stack. Wire to Serial1 (pins 18/19) so the USB-serial bridge
; doesn't interfere; sketch selects Serial1 automatically on Mega.
extends = avr_notecpp_common
board = megaatmega2560
extra_scripts =
    ${avr_notecpp_common.extra_scripts}
    pre:apply_api_style.py

; ═══════════════════════════════════════════════════════════════════════════
; Wokwi layered integration tests — each layer exercises one level deeper.
; Run: ./wokwi-test.sh wokwi-layer1 "PASS L1"
; ═══════════════════════════════════════════════════════════════════════════

[wokwi_layer_common]
platform = atmelavr
board = uno
framework = arduino
build_unflags = -std=gnu++11
build_src_flags = -std=gnu++17
lib_deps =
    ${notecpp_common.lib_deps}
    https://github.com/modm-io/avr-libstdcpp.git
src_filter = +<main_wokwi_layers.cpp>
lib_ldf_mode = chain+
extra_scripts = pre:exclude_avr_libstdcpp_src.py

[env:wokwi-layer1]
; L1: SerialHal transmit + receive
extends = wokwi_layer_common
build_flags = -DWOKWI_LAYER=1

[env:wokwi-layer2]
; L2: NotecardSerial reset handshake
extends = wokwi_layer_common
build_flags = -DWOKWI_LAYER=2

[env:wokwi-layer3]
; L3: StreamingTransport transact (JSON request/response)
extends = wokwi_layer_common
build_flags = -DWOKWI_LAYER=3 -DNOTE_MINIMAL

[env:wokwi-layer4]
; L4: Full Api.execute with typed response parsing
extends = wokwi_layer_common
build_flags = -DWOKWI_LAYER=4 -DNOTE_MINIMAL -DSERIAL_TX_BUFFER_SIZE=16 -DSERIAL_RX_BUFFER_SIZE=32

[env:wokwi-layer5]
; L5: minimal transact_raw round-trip via StaticNotecard
; NOTE_MINIMAL matches the STYLE=4 config (no std::string on AVR).
extends = wokwi_layer_common
build_flags = -DWOKWI_LAYER=5 -DNOTE_MINIMAL

[env:wokwi-layer4-gcc12]
; L4 with avr-gcc 12 — tests whether the execute() return crash is a gcc 7.3 bug.
extends = wokwi_layer_common
build_flags = -DWOKWI_LAYER=4 -DNOTE_MINIMAL -UNOTE_STATIC_PARSE_BUF
platform_packages =
    toolchain-atmelavr@symlink:///tmp/avr-toolchain-12

[env:wokwi-notec]
; note-c AVR on Wokwi — same mock Notecard, same operations
platform = atmelavr
board = uno
framework = arduino
build_flags = ${notec_common.build_flags}
lib_deps = ${notec_common.lib_deps}
build_src_filter = ${notec_common.build_src_filter}

