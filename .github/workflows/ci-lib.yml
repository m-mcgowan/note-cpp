name: Library CI

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - compiler: g++-12
            packages: g++-12
            cxxflags: -std=c++20
          - compiler: g++-13
            packages: g++-13
            cxxflags: -std=c++23
          - compiler: g++-14
            packages: g++-14
            cxxflags: -std=c++23
          - compiler: clang++-17
            packages: clang-17 libc++-17-dev libc++abi-17-dev
            cxxflags: -std=c++20 -stdlib=libc++
          - compiler: clang++-18
            packages: clang-18 libc++-18-dev libc++abi-18-dev libstdc++-13-dev
            cxxflags: -std=c++23 -stdlib=libc++
    steps:
      - uses: actions/checkout@v5

      - name: Cache apt packages
        uses: actions/cache@v5
        id: apt-cache
        with:
          path: ~/apt-cache
          key: apt-${{ matrix.compiler }}-${{ hashFiles('.github/workflows/ci-lib.yml') }}

      - name: Install compiler
        run: |
          if [ -d ~/apt-cache ]; then
            sudo cp -r ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
          mkdir -p ~/apt-cache
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install Python dependencies
        run: pip install jinja2

      - name: Run CI checks
        env:
          CXX: ${{ matrix.compiler }}
          CXXFLAGS: ${{ matrix.cxxflags }}
        run: ./ci.sh

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          # GCC required for accurate consteval coverage (see docs/coverage.md).
          # lcov 2.2+ required: 2.0 (Ubuntu apt) inflates function counts by
          # counting each template instantiation separately, and misreports branches.
          # lcov 2.3 Perl dependencies (see lcov-2.3/README §3)
          sudo apt-get install -y g++-13 \
            libcapture-tiny-perl libdatetime-perl libjson-perl libtimedate-perl
          LCOV_VERSION=2.3
          curl -sL "https://github.com/linux-test-project/lcov/releases/download/v${LCOV_VERSION}/lcov-${LCOV_VERSION}.tar.gz" | tar -xz
          sudo make -C "lcov-${LCOV_VERSION}" install

      - name: Install Python dependencies
        run: pip install jinja2

      - name: Run CI (runs codegen, uses default compiler)
        run: ./ci.sh

      - name: Generate coverage report
        run: ./ci.sh --coverage

      - name: Configure lcov
        run: echo -e "check_data_consistency = 0\nbranch_coverage = 1" > ~/.lcovrc

      - name: Report coverage
        uses: zgosalvez/github-actions-report-lcov@v4
        with:
          coverage-files: coverage/coverage.lcov
          minimum-coverage: 94
          artifact-name: coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true
