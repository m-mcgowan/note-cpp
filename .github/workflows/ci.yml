# Main CI entrypoint — runs on every push to main and every PR.
#
# Each job is a thin wrapper that invokes the corresponding stage in
# ci.sh (the single source of truth for what "CI" means locally and
# remotely). Contributors can reproduce any failure with ./ci.sh.
#
# workflow_dispatch lets maintainers trigger a subset — defaults to the
# full matrix; other build-type values skip the jobs they don't gate.
#
# Sibling workflows:
#   - release.yml          publishes a release (manual)
#   - release-validate.yml  pre-release smoke matrix (manual)
#
# If you're tempted to inline a check here, reach for ci.sh first. The
# inlined surface got out of sync with ci.sh repeatedly before this
# refactor.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build type'
        type: choice
        default: full
        options:
          - full
          - quick
          - coverage
          - pio
          - compat

permissions:
  contents: read
  pull-requests: write

jobs:
  # Host unit tests + compile-check matrix. Delegates to ci.sh, which
  # runs codegen, public-API-header compile checks, version gating,
  # target filtering, and example builds — the full set that any
  # contributor can reproduce locally.
  build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.build-type == 'full'
      || inputs.build-type == 'quick'
    strategy:
      matrix:
        include:
          - compiler: g++-12
            packages: g++-12
            cxxflags: '-std=c++20'
          - compiler: g++-13
            packages: g++-13
            cxxflags: '-std=c++23'
          - compiler: g++-14
            packages: g++-14
            cxxflags: '-std=c++23'
          - compiler: clang++-17
            packages: clang-17 libc++-17-dev libc++abi-17-dev
            cxxflags: '-std=c++20 -stdlib=libc++'
          - compiler: clang++-18
            packages: clang-18 libc++-18-dev libc++abi-18-dev libstdc++-13-dev
            cxxflags: '-std=c++23 -stdlib=libc++'
    env:
      CXX: ${{ matrix.compiler }}
      CXXFLAGS: '${{ matrix.cxxflags }}'
    steps:
      - uses: actions/checkout@v5

      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: ~/apt-cache
          key: apt-${{ matrix.compiler }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install compiler
        run: |
          if [ -d ~/apt-cache ]; then
            sudo cp -r ~/apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          fi
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
          mkdir -p ~/apt-cache
          cp /var/cache/apt/archives/*.deb ~/apt-cache/ 2>/dev/null || true

      - name: Install Python dependencies
        run: pip install jinja2

      # ci.sh --full runs: codegen-verify, host unit tests (default +
      # NOTE_MINIMAL), C++20/C++17 public-API-header compile checks,
      # version gating, target filtering, and stdcpp example builds.
      # Keep this in sync with run_ci() in ci.sh.
      - name: Run CI checks
        run: ./ci.sh --full

  # PlatformIO builds that ci.sh doesn't exercise locally: the on-device
  # integration firmware (both transports) and the Arduino migration
  # example. Also runs tools/verify-docs.sh to flag documentation drift
  # against generated snippets.
  pio-build:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.build-type == 'full'
      || inputs.build-type == 'pio'
    steps:
      - uses: actions/checkout@v5

      - name: Cache PlatformIO
        uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('tests/integration/firmware/platformio.ini', 'examples/arduino/migration/platformio.ini', 'examples/arduino/note-arduino-bridge/platformio.ini', 'tools/binary-size-comparison/platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build integration firmware (serial)
        run: |
          NOTECARD_SERIAL_RX=38 NOTECARD_SERIAL_TX=39 \
          pio run -d tests/integration/firmware -e serial

      - name: Build integration firmware (i2c)
        run: |
          NOTECARD_I2C_SDA=14 NOTECARD_I2C_SCL=21 \
          pio run -d tests/integration/firmware -e i2c

      - name: Build Arduino migration example
        run: pio run -d examples/arduino/migration

      - name: Build Arduino note-arduino + note-cpp coexistence example
        run: pio run -d examples/arduino/note-arduino-bridge

      # Catches AVR-only breakage (PROGMEM regressions, missing pgmspace
      # guards, etc.) that the host build can't see. The same env is built
      # locally by ci.sh --quick when the atmelavr toolchain is present.
      - name: Build avr-notecpp (size sample)
        run: pio run -d tools/binary-size-comparison -e avr-notecpp

      - name: Install Python dependencies
        run: pip install jinja2

      - name: Verify docs
        run: tools/verify-docs.sh

  # Coverage: ci.sh --coverage re-runs tests under instrumentation and
  # produces an LCOV tracefile; reporting is a GitHub-specific overlay
  # (PR comment + Codecov upload) that stays in the workflow.
  coverage:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.build-type == 'full'
      || inputs.build-type == 'coverage'
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          # lcov 2.2+ is required — 2.0 miscounts functions (each template
          # instantiation gets its own entry) and misreports branches. See
          # docs/coverage.md for the full compatibility matrix.
          sudo apt-get install -y g++-13 \
            libcapture-tiny-perl libdatetime-perl libjson-perl libtimedate-perl
          LCOV_VERSION=2.3
          curl -sL "https://github.com/linux-test-project/lcov/releases/download/v${LCOV_VERSION}/lcov-${LCOV_VERSION}.tar.gz" | tar -xz
          sudo make -C "lcov-${LCOV_VERSION}" install

      - name: Install Python dependencies
        run: pip install jinja2

      - name: Run codegen + unit tests
        run: ./ci.sh

      - name: Generate coverage report
        run: ./ci.sh --coverage

      - name: Configure lcov
        run: echo -e "check_data_consistency = 0\nbranch_coverage = 1" > ~/.lcovrc

      - name: Report coverage
        uses: zgosalvez/github-actions-report-lcov@v4
        with:
          coverage-files: coverage/coverage.lcov
          minimum-coverage: 94
          artifact-name: coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage.lcov
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          disable_search: true
          fail_ci_if_error: false

  # Multi-platform C++ compatibility via m-mcgowan/embedded-cpp-compat-check.
  # Verifies the library compiles under the compiler/SDK combinations
  # listed — meaningful because platform-vendored toolchains lag and
  # enforcing this here catches regressions that a single-compiler host
  # build misses.
  embedded-compat:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.build-type == 'full'
      || inputs.build-type == 'compat'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-compat-${{ hashFiles('library.json') }}
          restore-keys: pio-compat-

      - uses: m-mcgowan/embedded-cpp-compat-check/action@main
        with:
          platforms: esp32s3-arduino-v3 avr-uno stm32-nucleo-f411re

      - name: Show report
        run: cat compatibility.md >> $GITHUB_STEP_SUMMARY

  # arduino-cli compile for each published Arduino example, against both
  # ESP32-S3 and Blues Swan (STM32L4+). Exists alongside embedded-compat
  # because arduino-cli exercises the Arduino IDE's include-path rules,
  # which differ from raw PlatformIO builds and have surfaced real bugs.
  arduino-cli:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.build-type == 'full'
      || inputs.build-type == 'compat'
    steps:
      - uses: actions/checkout@v5

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install Arduino board cores
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://github.com/stm32duino/BoardManagerFiles/raw/main/package_stmicroelectronics_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli core install STMicroelectronics:stm32

      - name: Compile Arduino sketches (arduino-cli)
        run: |
          for sketch in quickstart readme_snippets serial_basic i2c_basic; do
            echo "::group::$sketch (ESP32-S3)"
            arduino-cli compile \
              --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc \
              --library "$PWD" \
              "examples/arduino/$sketch"
            echo "::endgroup::"

            echo "::group::$sketch (Blues Swan)"
            arduino-cli compile \
              --fqbn STMicroelectronics:stm32:Blues:pnum=SWAN_R5 \
              --library "$PWD" \
              "examples/arduino/$sketch"
            echo "::endgroup::"
          done
