[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_flags =
    -std=gnu++23
    -DDOCTEST_CONFIG_NO_POSIX_SIGNALS
    -DDOCTEST_CONFIG_IMPLEMENT
lib_deps =
    doctest/doctest@^2.4.11
    symlink://../../..
monitor_speed = 115200
test_framework = doctest

[env:esp32s3]
; Default env — override pins via env.sh or build_flags above.
