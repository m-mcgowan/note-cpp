[env:softcard]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board     = esp32-s3-devkitm-1
framework = arduino
build_flags =
    -std=gnu++23
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DDOCTEST_CONFIG_SUPER_FAST_ASSERTS
    -DDOCTEST_CONFIG_NO_POSIX_SIGNALS
    -DDOCTEST_THREAD_LOCAL=
    -DNOTECARD_TEST_SOFTCARD
; WiFi and Notehub credentials from environment variables.
; Set before running: WIFI_SSID, WIFI_PASS, NOTEHUB_PAT
    -DWIFI_SSID=\"${sysenv.WIFI_SSID}\"
    -DWIFI_PASS=\"${sysenv.WIFI_PASS}\"
    -DNOTEHUB_PAT=\"${sysenv.NOTEHUB_PAT}\"
lib_deps =
    doctest/doctest@^2.4.11
    https://github.com/m-mcgowan/pio-test-runner.git
    note-emu=symlink://${sysenv.HOME}/e/note-emu
    ; the note-cpp library
    symlink://../../..
monitor_speed = 115200
board_upload.after_reset = watchdog-reset
test_framework = custom
test_build_src = no
; TODO: pioarduino's test build doesn't configure mbedtls include paths
; the same way as application builds. NetworkClientSecure triggers PSA
; crypto headers that need MBEDTLS_CONFIG_FILE and the port include path.
; See note-emu/fix_mbedtls.py for a workaround script.
; Needs investigation: why does firmware/ build fine but softcard/ doesn't?
